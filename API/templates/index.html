<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 Loan Prediction System</h1>
            <p>Enter your details to check loan eligibility</p>
        </header>

        <form id="loanForm">
            <div class="form-grid">
                <!-- Personal Details -->
                <div class="form-section">
                    <h3>Personal Information</h3>
                    
                    <div class="form-group">
                        <label for="married">Marital Status:</label>
                        <select id="married" name="married" required>
                            <option value="">Select</option>
                            <option value="Yes">Married</option>
                            <option value="No">Not Married</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="education">Education:</label>
                        <select id="education" name="education" required>
                            <option value="">Select</option>
                            <option value="Graduate">Graduate</option>
                            <option value="Not Graduate">Not Graduate</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="selfEmployed">Employment Status:</label>
                        <select id="selfEmployed" name="selfEmployed" required>
                            <option value="">Select</option>
                            <option value="No">Salaried</option>
                            <option value="Yes">Self Employed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="propertyArea">Property Area:</label>
                        <select id="propertyArea" name="propertyArea" required>
                            <option value="">Select</option>
                            <option value="Urban">Urban</option>
                            <option value="Semiurban">Semi-Urban</option>
                            <option value="Rural">Rural</option>
                        </select>
                    </div>
                </div>

                <!-- Financial Details -->
                <div class="form-section">
                    <h3>Financial Information</h3>
                    
                    <div class="form-group">
                        <label for="applicantIncome">Applicant Income (₹):</label>
                        <input type="number" id="applicantIncome" name="applicantIncome" 
                               placeholder="e.g., 5000" min="0" step="100" required>
                    </div>

                    <div class="form-group">
                        <label for="coapplicantIncome">Co-applicant Income (₹):</label>
                        <input type="number" id="coapplicantIncome" name="coapplicantIncome" 
                               placeholder="e.g., 1500" min="0" step="100" value="0">
                    </div>

                    <div class="form-group">
                        <label for="loanAmount">Loan Amount (₹ in thousands):</label>
                        <input type="number" id="loanAmount" name="loanAmount" 
                               placeholder="e.g., 150" min="1" step="1" required>
                    </div>

                    <div class="form-group">
                        <label for="loanTerm">Loan Term (months):</label>
                        <select id="loanTerm" name="loanTerm" required>
                            <option value="">Select</option>
                            <option value="360">360 (30 years)</option>
                            <option value="240">240 (20 years)</option>
                            <option value="180">180 (15 years)</option>
                            <option value="120">120 (10 years)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="creditHistory">Credit History:</label>
                        <select id="creditHistory" name="creditHistory" required>
                            <option value="">Select</option>
                            <option value="1">Good (1.0)</option>
                            <option value="0">Poor (0.0)</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">Check Loan Eligibility</span>
                <span id="btnLoader" class="loader" style="display: none;"></span>
            </button>
        </form>

        <!-- Result Section -->
        <div id="resultSection" class="result-section" style="display: none;">
            <div id="resultCard" class="result-card">
                <h2 id="resultTitle"></h2>
                <p id="resultMessage"></p>
                <div class="probability-bars">
                    <div class="prob-item">
                        <label>Approval Probability:</label>
                        <div class="progress-bar">
                            <div id="approvalBar" class="progress-fill approval"></div>
                        </div>
                        <span id="approvalPercent"></span>
                    </div>
                    <div class="prob-item">
                        <label>Rejection Probability:</label>
                        <div class="progress-bar">
                            <div id="rejectionBar" class="progress-fill rejection"></div>
                        </div>
                        <span id="rejectionPercent"></span>
                    </div>
                </div>
                <p class="confidence">Confidence: <span id="confidence"></span></p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
